[general]
name = "my-deployment"
version = "1.0.0"
environment = "development"
prefix = "my-project"
kubeconfig_path = "kubeconfigs"
kind_config_path = "kind-configs"
max_workers = 4

# Cluster configuration
[clusters]
# Single cluster (enable: true)
[clusters.metrics]
enable = true

# Multiple clusters (count: number)
[clusters.primary]
count = 1

[clusters.secondary]
count = 2

# Disabled cluster (count: 0)
[clusters.standalone]
count = 0

# Global services (run on all clusters)
[services]
health-check = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get nodes" }
pods = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n kube-system" }

# Cluster-specific services (run only on primary clusters)
[clusters.primary.services]
namespaces = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get namespaces" }
