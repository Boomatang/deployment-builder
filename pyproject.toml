[project]
name = "deployment-builder"
version = "0.1.0"
description = ""
authors = [
    {name = "Jim Fitzpatrick",email = "jimfity@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0",
    "rich (>=14.1.0,<15.0.0)",
]

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
pytest = "^8.0.0"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.0"

[tool.poetry]
packages = [{include = "deployment_builder", from = "src"}]
scripts = {deploy = "deployment_builder.cli:cli"}

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "fast: Fast running tests",
    "cli: CLI command tests",
    "config: Configuration tests",
    "kind: Kind integration tests",
    "kubeconfig: Kubeconfig tests"
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--disable-warnings",
    "--cov=src",
    "--cov-report=html",
    "--maxfail=5"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# Logging
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format ="%Y-%m-%d %H:%M:%S"

# Performance settings
junit_family = "xunit2"
junit_logging = "all"
junit_log_passing_tests = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
