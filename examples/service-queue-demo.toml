[general]
name = "service-queue-demo"
version = "1.0.0"
environment = "demo"
prefix = "queue-demo"
max_workers = 6
load_balancing_strategy = "least_loaded"

[clusters]
# Single cluster types
[clusters.gateway]
enable = true

[clusters.monitoring]
enable = true

# Multiple cluster types
[clusters.worker]
count = 3

[clusters.database]
count = 2

[clusters.cache]
count = 1

# Global services with priorities and dependencies
[services]
[services.critical-health-check]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get nodes"
priority = 1
estimated_duration = 15.0

[services.security-scan]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n security"
priority = 2
estimated_duration = 120.0
dependencies = ["critical-health-check"]

[services.network-test]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get networkpolicies"
priority = 3
estimated_duration = 30.0
dependencies = ["security-scan"]

# Gateway-specific services
[clusters.gateway.services]
[clusters.gateway.services.nginx-status]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n nginx"
priority = 4
estimated_duration = 20.0
dependencies = ["network-test"]

[clusters.gateway.services.ssl-check]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get secrets -n nginx"
priority = 5
estimated_duration = 25.0
dependencies = ["nginx-status"]

# Worker-specific services
[clusters.worker.services]
[clusters.worker.services.app-deploy]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl apply -f app.yaml"
priority = 6
estimated_duration = 60.0
dependencies = ["network-test"]

[clusters.worker.services.app-verify]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -l app=myapp"
priority = 7
estimated_duration = 30.0
dependencies = ["app-deploy"]

[clusters.worker.services.load-test]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get hpa"
priority = 8
estimated_duration = 45.0
dependencies = ["app-verify"]

# Database-specific services
[clusters.database.services]
[clusters.database.services.db-backup]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pv"
priority = 9
estimated_duration = 90.0
dependencies = ["security-scan"]

[clusters.database.services.db-metrics]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n database"
priority = 10
estimated_duration = 20.0
dependencies = ["db-backup"]

# Cache-specific services
[clusters.cache.services]
[clusters.cache.services.redis-status]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n redis"
priority = 11
estimated_duration = 15.0
dependencies = ["network-test"]

[clusters.cache.services.redis-memory]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl top pods -n redis"
priority = 12
estimated_duration = 25.0
dependencies = ["redis-status"]

# Monitoring-specific services
[clusters.monitoring.services]
[clusters.monitoring.services.prometheus-status]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n monitoring"
priority = 13
estimated_duration = 30.0
dependencies = ["critical-health-check"]

[clusters.monitoring.services.grafana-dashboards]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get configmaps -n monitoring"
priority = 14
estimated_duration = 20.0
dependencies = ["prometheus-status"]

[clusters.monitoring.services.alert-rules]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get prometheusrules -n monitoring"
priority = 15
estimated_duration = 25.0
dependencies = ["grafana-dashboards"]
