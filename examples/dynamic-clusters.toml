[general]
name = "dynamic-clusters-demo"
prefix = "demo"
max_workers = 6

[clusters]
# Single cluster types (enable: true, count: 1)
[clusters.gateway]
enable = true
count = 1

[clusters.metrics]
enable = true
count = 1

# Multiple cluster types (count: number)
[clusters.worker]
count = 3

[clusters.database]
count = 2

[clusters.cache]
count = 1

# Cluster-specific services
[clusters.gateway.services]
nginx = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n nginx" }

[clusters.worker.services]
monitoring = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n monitoring" }

[clusters.database.services]
backup = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pv" }

# Global services
[services]
health-check = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get nodes" }
