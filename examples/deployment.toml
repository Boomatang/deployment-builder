[general]
name = "advanced-deployment"
version = "2.1.0"
environment = "staging"
prefix = "advanced-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Parallel processing
max_workers = 6

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 3

[clusters.secondary]
count = 2

[clusters.standalone]
count = 5

# Global services (run on all clusters)
[services]
[services.pods]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n kube-system"

[services.k8s-services]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get services -A"

[services.ingress]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get ingress -A"

# Cluster-specific services
[clusters.primary.services]
[clusters.primary.services.namespaces]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get namespaces"

[clusters.secondary.services]
[clusters.secondary.services.deployments]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get deployments -A"
