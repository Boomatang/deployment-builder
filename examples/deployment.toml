[general]
name = "advanced-deployment"
version = "2.1.0"
environment = "staging"
prefix = "advanced-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Parallel processing
max_workers = 6

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 3

[clusters.secondary]
count = 2

[clusters.standalone]
count = 5

# Global services (run on all clusters)
[services]
[services.health-check]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get nodes"
priority = 1
estimated_duration = 30.0

[services.pods]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n kube-system"
priority = 2
estimated_duration = 45.0
dependencies = ["health-check"]

[services.k8s-services]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get services -A"
priority = 3
estimated_duration = 60.0
dependencies = ["pods"]

[services.ingress]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get ingress -A"
priority = 4
estimated_duration = 30.0
dependencies = ["k8s-services"]

# Cluster-specific services
[clusters.primary.services]
[clusters.primary.services.namespaces]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get namespaces"
priority = 5
estimated_duration = 20.0
dependencies = ["ingress"]

[clusters.secondary.services]
[clusters.secondary.services.deployments]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get deployments -A"
priority = 6
estimated_duration = 40.0
dependencies = ["namespaces"]
