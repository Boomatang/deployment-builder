# Basic multi-cluster configuration
name = "my-deployment"
version = "1.0.0"
environment = "production"
prefix = "my-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Cluster configuration
[clusters]
metrics = true
primary = 2
secondary = 1
standard = 3

[resources]
cpu = "2"
memory = "4Gi"
replicas = 3

[[services]]
name = "web"
port = 8080
image = "nginx:latest"

[[services]]
name = "api"
port = 3000
image = "node:18-alpine"
