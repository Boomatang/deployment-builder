[general]
name = "my-deployment"
version = "1.0.0"
environment = "production"
prefix = "my-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Kind configuration
kind_config_path = "kind-configs"

# Parallel processing
max_workers = 4

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 2

[clusters.secondary]
count = 1

[clusters.standalone]
count = 3

# Global services (run on all clusters)
[services]
[services.health-check]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get nodes"
priority = 1
estimated_duration = 30.0

[services.pods]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n kube-system"
priority = 2
estimated_duration = 45.0
dependencies = ["health-check"]

# Cluster-specific services (run only on primary clusters)
[clusters.primary.services]
[clusters.primary.services.namespaces]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get namespaces"
priority = 3
estimated_duration = 20.0
dependencies = ["pods"]
