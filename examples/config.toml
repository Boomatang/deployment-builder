[general]
name = "my-deployment"
version = "1.0.0"
environment = "production"
prefix = "my-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Kind configuration
kind_config_path = "kind-configs"

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 2

[clusters.secondary]
count = 1

[clusters.standard]
count = 3
