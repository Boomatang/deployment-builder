[general]
name = "my-deployment"
version = "1.0.0"
environment = "production"
prefix = "my-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Kind configuration
kind_config_path = "kind-configs"

# Parallel processing
max_workers = 4

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 2

[clusters.secondary]
count = 1

[clusters.standalone]
count = 3

[services]
[services.pods]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get pods -n kube-system"

[services.nodes]
"kubeconfig.flag" = "--kubeconfig"
cmd = "kubectl get nodes"
