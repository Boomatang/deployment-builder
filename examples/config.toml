[general]
name = "my-deployment"
version = "1.0.0"
environment = "production"
prefix = "my-project"

# Kubeconfig configuration
kubeconfig_path = "kubeconfigs"

# Kind configuration
kind_config_path = "kind-configs"

# Cluster configuration
[clusters]
[clusters.metrics]
enable = true

[clusters.primary]
count = 2

[clusters.secondary]
count = 1

[clusters.standard]
count = 3

# Kind cluster configuration options
[networking]
ipFamily = "ipv4"
apiServerAddress = "127.0.0.1"

[feature_gates]
"CSIMigration" = true

[resources]
cpu = "2"
memory = "4Gi"
replicas = 3

[[services]]
name = "web"
port = 8080
image = "nginx:latest"

[[services]]
name = "api"
port = 3000
image = "node:18-alpine"
