[general]
name = "edge-computing-platform"
version = "1.5.0"
environment = "production"
prefix = "edge"
kubeconfig_path = "kubeconfigs"
kind_config_path = "kind-configs"
max_workers = 6

[clusters]
# Central control plane (single cluster)
[clusters.control-plane]
enable = true

# Edge locations (multiple edge sites)
[clusters.edge-site-1]
enable = true

[clusters.edge-site-2]
enable = true

[clusters.edge-site-3]
enable = true

# Regional data centers (multiple instances per region)
[clusters.region-us-east]
count = 2

[clusters.region-us-west]
count = 2

[clusters.region-eu-central]
count = 2

[clusters.region-asia-pacific]
count = 2

# IoT data processing clusters
[clusters.iot-processor]
count = 4

# Machine learning inference clusters
[clusters.ml-inference]
count = 3

# Data storage clusters
[clusters.time-series-db]
count = 2

[clusters.object-storage]
count = 2

# Monitoring and alerting
[clusters.edge-monitoring]
enable = true

[clusters.central-monitoring]
enable = true

# Global services (run on all clusters)
[services]
edge-health = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get nodes" }
network-connectivity = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get networkpolicies" }
security-scan = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n security" }

# Control plane specific services
[clusters.control-plane.services]
cluster-management = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get clusters" }
policy-enforcement = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get policies" }

# Edge site specific services
[clusters.edge-site-1.services]
local-processing = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n edge-processing" }
data-sync = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get jobs -n data-sync" }

[clusters.edge-site-2.services]
local-processing = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n edge-processing" }
data-sync = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get jobs -n data-sync" }

[clusters.edge-site-3.services]
local-processing = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n edge-processing" }
data-sync = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get jobs -n data-sync" }

# Regional data center services
[clusters.region-us-east.services]
data-replication = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pv" }
backup-schedule = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get cronjobs -n backup" }

[clusters.region-us-west.services]
data-replication = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pv" }
backup-schedule = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get cronjobs -n backup" }

# IoT processing services
[clusters.iot-processor.services]
data-ingestion = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n iot" }
stream-processing = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n streaming" }

# ML inference services
[clusters.ml-inference.services]
model-serving = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n ml-serving" }
inference-metrics = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n ml-metrics" }
