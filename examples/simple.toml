[general]
name = "simple-example"
version = "1.0.0"
environment = "development"
prefix = "simple"
kubeconfig_path = "kubeconfigs"
kind_config_path = "kind-configs"
max_workers = 2

[clusters]
# A simple web application
[clusters.web]
enable = true
count = 1

# A simple API
[clusters.api]
enable = true
count = 1

# A simple database
[clusters.database]
enable = true
count = 1

# Global services (run on all clusters)
[services]
health-check = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get nodes" }
