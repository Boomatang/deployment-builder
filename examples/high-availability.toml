[general]
name = "high-availability-system"
version = "2.0.0"
environment = "production"
prefix = "ha"
kubeconfig_path = "kubeconfigs"
kind_config_path = "kind-configs"
max_workers = 10

[clusters]
# Load balancers (multiple instances for redundancy)
[clusters.load-balancer]
count = 3

# Web servers (multiple instances for high availability)
[clusters.web-server]
count = 5

# API servers (multiple instances for load distribution)
[clusters.api-server]
count = 4

# Database clusters (primary and multiple replicas)
[clusters.database-primary]
enable = true

[clusters.database-replica]
count = 3

# Cache clusters (multiple instances for redundancy)
[clusters.redis-cluster]
count = 4

# Message queue clusters (multiple instances for fault tolerance)
[clusters.rabbitmq-cluster]
count = 3

# Search clusters (multiple instances for performance)
[clusters.elasticsearch-cluster]
count = 3

# Monitoring clusters (multiple instances for redundancy)
[clusters.prometheus-cluster]
count = 2

[clusters.grafana-cluster]
count = 2

# Logging clusters (multiple instances for high availability)
[clusters.fluentd-cluster]
count = 3

[clusters.elasticsearch-logging]
count = 3

# Global services (run on all clusters)
[services]
ha-health-check = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get nodes" }
network-connectivity = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get networkpolicies" }
security-scan = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n security" }

# Load balancer services
[clusters.load-balancer.services]
nginx-status = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n nginx" }
ssl-cert-check = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get secrets -n nginx" }

# Web server services
[clusters.web-server.services]
app-deploy = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get deployments -n web" }
app-logs = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl logs -n web --tail=100" }

# API server services
[clusters.api-server.services]
api-deploy = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get deployments -n api" }
api-metrics = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n api" }

# Database services
[clusters.database-primary.services]
db-backup = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pv" }
db-metrics = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n database" }

[clusters.database-replica.services]
replica-sync = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n database" }
replica-lag = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl logs -n database --tail=50" }

# Redis cluster services
[clusters.redis-cluster.services]
redis-status = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n redis" }
redis-memory = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl top pods -n redis" }

# RabbitMQ cluster services
[clusters.rabbitmq-cluster.services]
queue-status = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n rabbitmq" }
queue-metrics = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl logs -n rabbitmq --tail=50" }

# Elasticsearch cluster services
[clusters.elasticsearch-cluster.services]
search-status = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n search" }
index-health = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl logs -n search --tail=50" }

# Monitoring services
[clusters.prometheus-cluster.services]
metrics-collect = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n monitoring" }
alert-status = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get configmaps -n monitoring" }

# Logging services
[clusters.fluentd-cluster.services]
log-forward = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl get pods -n logging" }
log-parsing = { "kubeconfig.flag" = "--kubeconfig", cmd = "kubectl logs -n logging --tail=50" }
